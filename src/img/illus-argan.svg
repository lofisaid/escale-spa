<linearGradient id="oil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E7B46A"/><stop offset="1" stop-color="#B9792F"/></linearGradient>
<linearGradient id="table" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9CDBD"/><stop offset="1" stop-color="#DDBBA8"/></linearGradient>
